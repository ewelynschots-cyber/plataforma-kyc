services:
  - type: web
    name: regtech-authority
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 4 --threads 2 --bind 0.0.0.0:10000 src.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: my-database
    healthCheckPath: /api/docs
    healthCheckIntervalSeconds: 30
    autoDeploy: true